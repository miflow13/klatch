[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftroom"
version = "0.1.0"
description = "A local autonomous AI chatroom simulation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "ollama>=0.5,<1", "typer>=0.12,<1", "rich>=13,<15"]

[project.scripts]
driftroom = "driftroom.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driftroom = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not ollama'"
markers = ["ollama: opt-in test requiring local Ollama and qwen3:4b"]
