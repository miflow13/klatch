[[agents]]
id = "june"
name = "June"
model = "qwen3:4b"

[agents.traits]
reserved = 0.7
curiosity = 0.8
humor = 0.5
impulsiveness = 0.25
formality = 0.2

[agents.sampling]
repeat_last_n = 1024  # window the repeat penalty looks back over (0 off, -1 = whole context)

[[agents]]
id = "milo"
name = "Milo"
model = "qwen3:4b"

[agents.traits]
reserved = 0.3
curiosity = 0.6
humor = 0.8
impulsiveness = 0.65
formality = 0.2

[agents.sampling]
repeat_last_n = 1024  # window the repeat penalty looks back over (0 off, -1 = whole context)

[[agents]]
id = "ada"
name = "Ada"
model = "qwen3:4b"

[agents.traits]
reserved = 0.5
curiosity = 0.9
humor = 0.4
impulsiveness = 0.35
formality = 0.6

[agents.sampling]
repeat_last_n = 1024  # window the repeat penalty looks back over (0 off, -1 = whole context)

[scheduler]
base_bias = -0.35
talkativeness_weight = 0.45
direct_mention_bonus = 0.55
topic_overlap_weight = 0.25
elapsed_weight = 0.30
relationship_weight = 0.10
recent_speaker_penalty = 0.45
cooldown_penalty = 1.00
random_jitter = 0.15
candidate_threshold = 0.20
decision_tick_ms = 5000
silence_ambient_after_ms = 300000
ambient_min_interval_ms = 900000
speaker_cooldown_ms = 20000
wait_cooldown_ms = 90000
# Two roles: (1) Jaccard threshold at which the last two visible events, both messages,
# count as an echo and damp the whole room; (2) the cap above which an agent's topic-overlap
# term contributes nothing. An environment event as either of the last two visible events
# ends the damping. 0 disables topic overlap entirely (and damps every message pair).
repetition_similarity_threshold = 0.6
repetition_damping = 0.5

[runtime]
startup_mode = "blank"  # blank | environment | topic ("custom" is reserved)
# topic = "..."  # required with startup_mode = "topic"; leave unset otherwise
runtime_mode = "balanced"
model_thinking = false
recent_context_events = 20
max_output_tokens = 256
inference_timeout_seconds = 120
retry_count = 1
max_context_tokens = 8192
clock_mode = "realtime"
clock_speed = 1.0
# random_seed = 1234  # optional, for controlled experiments
